<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Портфельный Информер</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Информер">
<meta name="theme-color" content="#0f1720">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="wrap hrow">
    <button class="iconbtn back" id="backBtn" aria-label="Назад" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 id="title">Портфели</h1>
    <div class="stamp" id="stamp"></div>
    <button class="iconbtn" id="refreshBtn" aria-label="Обновить">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>
    </button>
  </div>
  <div class="wrap" id="banner"></div>
</header>

<main class="wrap" id="main"></main>

<nav class="tabs" aria-label="Разделы">
  <button data-go="portfolio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>Портфели</button>
  <button data-go="alerts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>Алерты</button>
  <button data-go="status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Состояние</button>
</nav>

<div class="sheet-bg" id="sheetBg" hidden></div>
<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></section>

<script src="/static/app.js"></script>
</body>
</html>
